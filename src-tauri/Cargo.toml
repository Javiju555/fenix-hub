[package]
name = "fenix-hub-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "fenix_hub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fenix-hub"
path = "src/main.rs"

[dependencies]
fenix-hub-core = { path = "../crates/fenix-hub-core" }
fenix-hub-daemon = { path = "../crates/fenix-hub-daemon" }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
mdns-sd = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }

# Cross-platform clipboard (Wayland/X11/Windows)
arboard = "3"
# Config/data directory resolution (~/.config, %APPDATA%, etc.)
dirs = "6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
