[package]
name = "fenix-hub-app"
version = "0.3.6"
edition = "2021"

[lib]
name = "fenix_hub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fenix-hub"
path = "src/main.rs"

[dependencies]
fenix-hub-core = { path = "../crates/fenix-hub-core" }
fenix-hub-daemon = { path = "../crates/fenix-hub-daemon" }

tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
mdns-sd = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }

# Cross-platform clipboard (Wayland/X11/Windows)
arboard = "3"
# Image decoding — needed to write images to the system clipboard (RGBA8)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Config/data directory resolution (~/.config, %APPDATA%, etc.)
dirs = "6"
# MIME type detection from file extension
mime_guess = "2"
# Local network interface IP enumeration (for self-peer filtering)
local-ip-address = "0.6"
# Native save dialog for peer exports
rfd = "0.15"
# ZIP archive creation/extraction (store mode for folder sharing)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Directory traversal for folder zipping
walkdir = "2"
# Secure keyring storage for identity persistence
keyring = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows clipboard: set CF_PNG directly — avoids JPEG→RGBA8 decode (was 4-5s per image)
clipboard-win = "5"
# Native drag-and-drop interception at window level (IDropTarget, IDataObject, CF_HDROP, virtual files)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK is already a transitive dep of Tauri on Linux; we expose it directly
# to set window type hints (Utility) so compositors float the window and
# skip the taskbar without needing WM-specific workarounds.
gtk = { version = "0.18", package = "gtk" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
