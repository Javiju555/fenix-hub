[package]
name = "fenix-hub-daemon"
version = "0.2.2"
edition = "2021"
description = "FenixHub daemon abstraction: platform-specific background process integration"

[dependencies]
fenix-hub-core = { path = "../fenix-hub-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
mdns-sd = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for system notification integration (libnotify protocol)
# zbus = "4"  # uncomment when implementing D-Bus notifications

[target.'cfg(target_os = "windows")'.dependencies]
# Windows system tray and notifications
# windows = { version = "0.58", features = [...] }  # uncomment when implementing Windows support
