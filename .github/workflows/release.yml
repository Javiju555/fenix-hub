name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: checkout Fenix Installer
        if: matrix.platform == 'windows-latest'
        uses: actions/checkout@v4
        with:
          repository: Javiju555/instalador
          token: ${{ secrets.INSTALLER_REPO_TOKEN }}
          path: instalador
          persist-credentials: false

      - name: setup node & bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup2.4-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: install root dependencies
        run: bun install

      - name: install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: build and release Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fenix Hub v__VERSION__'
          releaseBody: 'Release de Fenix Hub - v__VERSION__'
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false

      - name: build custom Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          INSTALLER_REPO_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./instalador/scripts/build-project-installer.ps1 `
            -StageDir packaging/stage `
            -Publisher "Javiju"

      - name: upload custom Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Fenix Hub $tag" --notes "Release de Fenix Hub - $tag"
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag
              if ($LASTEXITCODE -ne 0) {
                throw "Could not create or find GitHub release $tag"
              }
            }
          }

          # Delete the tauri-action uploaded setup.exe (different casing) before
          # uploading the custom installer's version.
          $oldAsset = "FenixHub_${version}_x64-setup.exe"
          gh release delete-asset $tag $oldAsset --yes 2>$null

          $installer = Get-ChildItem target/release/bundle/*-Setup.exe | Select-Object -First 1
          if ($installer) {
            gh release upload $tag $installer.FullName --clobber
          }
